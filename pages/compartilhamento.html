<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Compartilhe suas fotos e vídeos do JOVI Snapflow." />
  <meta name="theme-color" content="#05081c" />
  <title>JOVI Snapflow — Compartilhar</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jovi: {
              bg:     '#05081c',
              panel:  '#0a1030',
              card:   '#121a3d',
              line:   '#1e2a5a',
              blue:   '#38bdf8',
              purple: '#8b5cf6',
              muted:  '#94a3c4'
            }
          },
          fontFamily: {
            display: [
              'ui-monospace', 'SFMono-Regular', '"SF Mono"', 'Menlo',
              'Consolas', '"Liberation Mono"', 'monospace'
            ],
            sans: [
              'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"',
              'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'
            ]
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="bg-jovi-bg text-slate-100 font-sans min-h-screen antialiased">

  <div class="jovi-glow" aria-hidden="true"></div>

  <div class="relative z-10 lg:flex lg:min-h-screen">

    <!-- ===================== NAVEGAÇÃO ===================== -->
    <nav aria-label="Navegação principal"
         class="fixed bottom-0 left-0 right-0 z-30 border-t border-jovi-line bg-jovi-panel/95 backdrop-blur
                pb-[env(safe-area-inset-bottom)]
                lg:static lg:order-first lg:w-24 lg:shrink-0 lg:border-t-0 lg:border-r lg:pb-0">
      <ul class="flex items-center justify-around lg:h-full lg:flex-col lg:justify-start lg:gap-2 lg:pt-8">
        <li class="flex-1 lg:w-full lg:flex-none">
          <a href="../index.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/>
            </svg>
            <span>Início</span>
          </a>
        </li>
        <li class="flex-1 lg:w-full lg:flex-none">
          <a href="galeria.html" class="nav-item is-active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <circle cx="8.5" cy="9.5" r="1.5"/>
              <path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5" stroke-linejoin="round"/>
            </svg>
            <span>Galeria</span>
          </a>
        </li>
        <li class="flex-1 lg:w-full lg:flex-none">
          <a href="performance.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M4 19V10M10 19V5M16 19v-7M22 19V8" stroke-linecap="round"/>
            </svg>
            <span>Performance</span>
          </a>
        </li>
        <li class="flex-1 lg:w-full lg:flex-none">
          <a href="#" class="nav-item" data-em-breve="Perfil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0" stroke-linecap="round"/>
            </svg>
            <span>Perfil</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- ===================== CONTEÚDO ===================== -->
    <div class="flex-1">

      <header class="sticky top-0 z-20 border-b border-jovi-line/70 bg-jovi-bg/80 px-4 py-3 backdrop-blur
                     sm:px-6 lg:px-10">
        <div class="mx-auto flex max-w-4xl items-center justify-between gap-4">
          <div>
            <h1 class="font-display text-lg tracking-widest sm:text-xl">
              JOVI <span class="text-jovi-blue">SNAPFLOW</span>
            </h1>
            <p class="mt-0.5 text-[11px] text-jovi-muted sm:text-xs">Captura inteligente por IA</p>
          </div>

          <button id="btn-notificacoes" type="button"
                  class="relative grid h-11 w-11 place-items-center rounded-full border border-jovi-line
                         bg-jovi-card text-jovi-muted transition hover:text-jovi-blue
                         focus-visible:outline focus-visible:outline-2 focus-visible:outline-jovi-blue"
                  aria-label="Abrir notificações">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7" stroke-linejoin="round"/>
              <path d="M10.5 19a2 2 0 0 0 3 0" stroke-linecap="round"/>
            </svg>
            <span class="absolute right-3 top-3 h-2 w-2 rounded-full bg-jovi-purple ring-2 ring-jovi-card"></span>
          </button>
        </div>
      </header>

      <main class="mx-auto max-w-4xl px-4 pb-28 pt-5 sm:px-6 lg:px-10 lg:pb-10">

        <div class="flex items-center gap-3">
          <a href="galeria.html" class="btn-voltar" aria-label="Voltar para a galeria">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="m14 6-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <div>
            <h2 class="font-display text-2xl tracking-wider sm:text-3xl">Compartilhar mídia</h2>
            <p class="mt-1 text-xs text-jovi-muted sm:text-sm">Escolha por onde deseja enviar esta captura.</p>
          </div>
        </div>

        <section aria-labelledby="titulo-opcoes"
                 class="mt-6 grid gap-8 lg:grid-cols-[280px_minmax(0,1fr)] lg:items-start">

          <!-- Preview da mídia -->
          <div>
            <div id="preview-midia" class="preview-compartilhamento">
              <svg id="preview-icone" class="preview-icone" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="m3 18 6-8 4 5 2-2.5L21 18z" stroke-linejoin="round"/>
                <circle cx="17" cy="7" r="2"/>
              </svg>
              <span id="preview-badge-tipo" class="badge-tipo">Foto</span>
            </div>
            <p id="preview-nome" class="mt-3 text-sm font-semibold">Mídia selecionada</p>
            <p id="preview-categoria" class="text-xs text-jovi-muted">Categoria</p>
          </div>

          <!-- Opções de compartilhamento -->
          <div>
            <h3 id="titulo-opcoes" class="text-xs font-semibold uppercase tracking-wider text-jovi-muted">
              Compartilhar com
            </h3>

            <div id="opcoes-compartilhamento" class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4"
                 role="group" aria-label="Escolher aplicativo para compartilhar">

              <button type="button" class="opcao-compartilhar" data-opcao="WhatsApp" aria-pressed="false">
                <span class="opcao-icone text-emerald-400">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M4 20l1.3-4A8 8 0 1 1 9 19.3z" stroke-linejoin="round"/>
                    <path d="M9 10c.3 2 2 3.7 4 4" stroke-linecap="round"/>
                  </svg>
                </span>
                <span>WhatsApp</span>
              </button>

              <button type="button" class="opcao-compartilhar" data-opcao="Instagram" aria-pressed="false">
                <span class="opcao-icone text-fuchsia-400">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="4"/>
                    <circle cx="12" cy="12" r="3.3"/>
                    <circle cx="16.2" cy="7.8" r="0.6" fill="currentColor" stroke="none"/>
                  </svg>
                </span>
                <span>Instagram</span>
              </button>

              <button type="button" class="opcao-compartilhar" data-opcao="Telegram" aria-pressed="false">
                <span class="opcao-icone text-sky-400">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="m4 12.5 15-8-3.5 15-5-4-3 3-1-5.5z" stroke-linejoin="round"/>
                  </svg>
                </span>
                <span>Telegram</span>
              </button>

              <button type="button" class="opcao-compartilhar" data-opcao="E-mail" aria-pressed="false">
                <span class="opcao-icone text-slate-300">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
                    <path d="m4.5 7 7.5 5.5L19.5 7" stroke-linejoin="round"/>
                  </svg>
                </span>
                <span>E-mail</span>
              </button>
            </div>

            <button id="btn-compartilhar-agora" type="button" class="btn-compartilhar-agora mt-6" disabled>
              Compartilhar agora
            </button>

            <p id="status-compartilhamento" role="status" aria-live="polite" class="mt-3 text-xs text-jovi-muted">
              Selecione um app para continuar.
            </p>
          </div>
        </section>

        <div class="mt-10">
          <a href="galeria.html" class="link-voltar-galeria">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="m14 6-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Voltar para Galeria
          </a>
        </div>
      </main>
    </div>
  </div>

  <p id="aviso" role="status" aria-live="polite"
     class="pointer-events-none fixed bottom-24 left-1/2 z-40 -translate-x-1/2 rounded-full border border-jovi-line
            bg-jovi-card px-5 py-2 text-xs text-slate-100 opacity-0 shadow-lg transition-opacity duration-300
            lg:bottom-8"></p>

  <script src="../js/compartilhamento.js"></script>
</body>
</html>
